services:
  server:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      PORT: 3000
    expose:
      - "3000"

  media:
    build:
      context: ../media
    restart: unless-stopped
    expose:
      - "4000"
    ports:
      - "4000:4000/tcp"
      - "50000-50100:50000-50100/udp"

  web:
    build:
      context: ../web
      args:
        VITE_API_URL: ""
        VITE_MEDIA_URL: "/media"
    restart: unless-stopped
    depends_on:
      - server
      - media
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
