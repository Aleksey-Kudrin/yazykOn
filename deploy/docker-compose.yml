services:
  server:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://yazykon:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/yazykon
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-yazykon.local}
      TURN_URL: ${TURN_URL:-}
      TURN_CREDENTIAL_TTL: ${TURN_CREDENTIAL_TTL:-3600}
      ROOM_ACCESS_SECRET: ${ROOM_ACCESS_SECRET:-}
      ROOM_ACCESS_TTL: ${ROOM_ACCESS_TTL:-86400}
      MEDIA_CONTROL_URL: ${MEDIA_CONTROL_URL:-http://media:4000}
      MEDIA_CONTROL_SECRET: ${MEDIA_CONTROL_SECRET:-}
      WEB_ORIGINS: ${WEB_ORIGINS:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MAX_ROOM_PEERS: ${MAX_ROOM_PEERS:-32}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yazykon
      POSTGRES_USER: yazykon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yazykon -d yazykon"]
      interval: 5s
      timeout: 5s
      retries: 10

  media:
    build:
      context: ../media
    restart: unless-stopped
    environment:
      WEBRTC_PUBLIC_IP: ${WEBRTC_PUBLIC_IP:-}
      ROOM_ACCESS_SECRET: ${ROOM_ACCESS_SECRET:-}
      MEDIA_CONTROL_SECRET: ${MEDIA_CONTROL_SECRET:-}
      WEB_ORIGINS: ${WEB_ORIGINS:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MAX_ROOM_PEERS: ${MAX_ROOM_PEERS:-32}
    expose:
      - "4000"
    ports:
      - "4000:4000/tcp"
      - "50000-50100:50000-50100/udp"

  turn:
    image: coturn/coturn:4.18.0
    restart: unless-stopped
    command:
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-change-me}
      - --realm=${TURN_REALM:-yazykon.local}
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --no-cli
      - --external-ip=${TURN_PUBLIC_IP:-127.0.0.1}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"

  web:
    build:
      context: ../web
      args:
        VITE_API_URL: ""
        VITE_MEDIA_URL: "/media"
        VITE_STUN_URL: "${VITE_STUN_URL:-stun:stun.l.google.com:19302}"
        VITE_TURN_URL: "${VITE_TURN_URL:-}"
    restart: unless-stopped
    depends_on:
      - server
      - media
      - turn
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
