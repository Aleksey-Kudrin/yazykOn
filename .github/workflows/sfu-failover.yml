name: SFU failover integration

on:
  push:
    branches:
      - test/sfu-chaos-failover
  workflow_dispatch:

jobs:
  failover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: npm install
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start Redis and two SFUs
        run: docker compose -p yazykon-sfu-it -f docker-compose.sfu-failover.yml up -d --build
      - name: Wait for SFUs
        run: |
          for url in http://127.0.0.1:4100/health http://127.0.0.1:4200/health; do
            ready=0
            for i in $(seq 1 60); do
              if curl -fsS "$url" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" -eq 1
          done
      - name: Run failover, media, Redis, load and chaos probes
        env:
          SFU_FAILOVER_LIVE: "1"
          SFU_CHAOS_LIVE: "1"
          SFU_FAILOVER_WAIT_MS: "5000"
          SFU_SLA_CYCLES: "4"
          SFU_FAILOVER_SLA_MS: "30000"
          SFU_ROOM_OWNER_TTL: 3s
          SFU_ROOM_OWNER_TTL_MS: "3000"
          SFU_CLUSTER_HEARTBEAT: 1s
          SFU_LOAD_ROOMS: "3"
          SFU_LOAD_PARTICIPANTS: "8"
          SFU_LOAD_CYCLES: "3"
          SFU_METRICS_SAMPLE_MS: "1000"
          SFU_SOAK_DURATION_MS: "120000"
          SFU_SOAK_SAMPLE_MS: "2000"
          SFU_SOAK_MAX_ERROR_RATE: "0.01"
          SFU_SOAK_MAX_SAMPLE_ERROR_RATE: "0.01"
          SFU_SOAK_MAX_RESOURCE_GROWTH: "0.20"
          SFU_SOAK_CYCLE_MS: "10000"
          SFU_SOAK_MAX_HEAP_BYTES: "0"
          SFU_REGRESSION_CYCLES: "4"
          SFU_REGRESSION_MAX_ACTIVE_DELTA: "1"
          SFU_REGRESSION_MAX_ROOM_DELTA: "0"
          SFU_REGRESSION_MAX_TRACK_DELTA: "0"
          SFU_REGRESSION_MAX_RESOURCE_GROWTH: "0.20"
          SFU_CHURN_ROUNDS: "12"
          SFU_CHURN_MAX_ACTIVE_DELTA: "1"
          SFU_CHURN_MAX_ROOM_DELTA: "0"
          SFU_CHURN_MAX_TRACK_DELTA: "0"
          SFU_MAX_IDLE_REDIS_KEYS: "20"
          SFU_MAX_CHURN_REDIS_KEYS: "4"
          SFU_ISOLATION_ROOMS: "3"
          SFU_MULTI_ROOM_MAX_ACTIVE_DELTA: "3"
          SFU_MULTI_ROOM_MAX_ROOM_DELTA: "3"
          SFU_MULTI_ROOM_MAX_TRACK_DELTA: "6"
          SFU_PERF_SAMPLES: "8"
          SFU_PERF_SAMPLE_INTERVAL_MS: "500"
          SFU_ARTIFACT_DIR: artifacts
          COMPOSE_PROJECT_NAME: yazykon-sfu-it
          ROOM_ACCESS_SECRET: integration-secret
          REDIS_URL: redis://127.0.0.1:6379
          SFU_PRIMARY_URL: http://127.0.0.1:4100
          SFU_SECONDARY_URL: http://127.0.0.1:4200
          SFU_FAILOVER_COMPOSE: docker-compose.sfu-failover.yml
        run: |
          set +e
          tests=(
            tests/sfu-failover.spec.ts
            tests/sfu-primary-crash-takeover.spec.ts
            tests/sfu-cross-node-reconnect.spec.ts
            tests/sfu-track-recovery.spec.ts
            tests/sfu-room-ownership.spec.ts
            tests/sfu-failover-stress.spec.ts
            tests/sfu-browser-media-failover.spec.ts
            tests/sfu-chaos-failover.spec.ts
            tests/sfu-multi-participant.spec.ts
            tests/sfu-load-soak.spec.ts
            tests/sfu-metrics.spec.ts
            tests/sfu-failover-latency.spec.ts
            tests/sfu-failover-sla.spec.ts
            tests/sfu-concurrent-rooms.spec.ts
            tests/sfu-redis-outage.spec.ts
            tests/sfu-redis-cleanup.spec.ts
            tests/sfu-multi-room-failover.spec.ts
            tests/sfu-remote-media-failover.spec.ts
            tests/sfu-failover-load-soak.spec.ts
            tests/sfu-performance-report.spec.ts
            tests/sfu-capacity-soak.spec.ts
            tests/sfu-chaos-regression.spec.ts
            tests/sfu-long-soak.spec.ts
            tests/sfu-peer-rejoin-stress.spec.ts
            tests/sfu-resource-budget-stress.spec.ts
            tests/sfu-media-frame-soak.spec.ts
            tests/sfu-redis-key-cardinality.spec.ts
            tests/sfu-ice-reconnect-recovery.spec.ts
            tests/sfu-duplicate-join.spec.ts
            tests/sfu-concurrent-room-churn.spec.ts
            tests/sfu-room-isolation-churn.spec.ts
            tests/sfu-concurrent-media-chaos.spec.ts
            tests/sfu-media-redis-recovery.spec.ts
            tests/sfu-concurrent-failover-redis-chaos.spec.ts
            tests/sfu-repeated-chaos-churn.spec.ts
          )
          failed=0
          for spec in "${tests[@]}"; do
            echo "===== SFU isolated probe: $spec ====="
            docker compose -p yazykon-sfu-it -f docker-compose.sfu-failover.yml down -v >/dev/null 2>&1 || true
            docker compose -p yazykon-sfu-it -f docker-compose.sfu-failover.yml up -d --build
            ready=0
            for i in $(seq 1 60); do
              primary_cluster=$(curl -fsS http://127.0.0.1:4100/health 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).cluster===true?"1":"0")}catch{process.stdout.write("0")}})' || echo 0)
              secondary_cluster=$(curl -fsS http://127.0.0.1:4200/health 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).cluster===true?"1":"0")}catch{process.stdout.write("0")}})' || echo 0)
              if [ "$primary_cluster" = "1" ] && [ "$secondary_cluster" = "1" ]; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "SFU cluster infrastructure failed to become ready for $spec"
              curl -fsS http://127.0.0.1:4100/health || true
              curl -fsS http://127.0.0.1:4200/health || true
              docker compose -p yazykon-sfu-it -f docker-compose.sfu-failover.yml logs --no-color --tail=200 || true
              failed=1
              continue
            fi
            npx playwright test "$spec" --workers=1
            rc=$?
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          docker compose -p yazykon-sfu-it -f docker-compose.sfu-failover.yml down -v >/dev/null 2>&1 || true
          exit "$failed"
      - name: Run consolidated failover gate
        if: always()
        env:
          SFU_FAILOVER_LIVE: "1"
          SFU_ARTIFACT_DIR: artifacts
        run: npx playwright test tests/sfu-failover-gate.spec.ts --workers=1
      - name: Collect failover artifacts
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -p yazykon-sfu-it -f docker-compose.sfu-failover.yml ps > artifacts/compose-ps.txt || true
          docker compose -p yazykon-sfu-it -f docker-compose.sfu-failover.yml logs --no-color > artifacts/sfu.log || true
          curl -fsS http://127.0.0.1:4100/metrics > artifacts/primary-metrics.txt || true
          curl -fsS http://127.0.0.1:4200/metrics > artifacts/secondary-metrics.txt || true
          docker stats --no-stream > artifacts/docker-stats.txt || true
      - name: Upload failover artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yazykon-sfu-failover-${{ github.run_id }}
          path: e2e/artifacts
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: docker compose -p yazykon-sfu-it -f docker-compose.sfu-failover.yml down -v
# Manual CI trigger for the current SFU failover validation.
