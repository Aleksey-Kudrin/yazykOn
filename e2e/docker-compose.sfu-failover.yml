services:
  sfu-primary:
    build:
      context: ../media
    environment:
      ROOM_ACCESS_SECRET: soak-test-room-secret
      MEDIA_CONTROL_SECRET: soak-test-control-secret
    ports:
      - "4100:4000"
    restart: unless-stopped

  sfu-secondary:
    build:
      context: ../media
    environment:
      ROOM_ACCESS_SECRET: soak-test-room-secret
      MEDIA_CONTROL_SECRET: soak-test-control-secret
    ports:
      - "4200:4000"
    restart: unless-stopped
